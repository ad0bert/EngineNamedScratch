name: build
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B verify
      # Runs the demo on Linux with Mesa's software OpenGL in a virtual X server: GL errors throw (debugGL), and the
      # last frames are kept as artifacts to look at: the running demo, the pause menu, and fullscreen.
      - name: Smoke-run the demo (Xvfb + Mesa)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri
          run() {
            name=$1; shift
            timeout 300 xvfb-run -a -s "-screen 0 1280x800x24" java -Dengine.debugGL=true \
              -Dengine.exitAfterFrames=120 -Dengine.captureMouse=false -Dengine.userDir="smoke-$name" \
              -Dengine.screenshot="smoke-$name.png" "$@" -jar demo/target/dist/demo.jar 2>&1 | tee "smoke-$name.log"
            grep -q "Saved screenshot" "smoke-$name.log"
            ! grep -E "Exception|GLException|ERROR" "smoke-$name.log"
          }
          run demo
          run paused -Ddemo.paused=true
          run fullscreen -Dengine.fullscreen=true
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: smoke-run
          path: |
            smoke-*.png
            smoke-*.log
